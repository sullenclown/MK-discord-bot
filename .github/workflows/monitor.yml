name: Scheduled Status Checker

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Trigger Source'
        required: false
        default: 'GitHub UI (Manual)'

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Stock Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ITEM_A_URL: ${{ secrets.ITEM_A_URL }}
          ITEM_B_URL: ${{ secrets.ITEM_B_URL }}
          ITEM_C_URL: ${{ secrets.ITEM_C_URL }}
          ITEM_D_URL: ${{ secrets.ITEM_D_URL }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'cron-job.org' }}
        run: python check_stock.py
